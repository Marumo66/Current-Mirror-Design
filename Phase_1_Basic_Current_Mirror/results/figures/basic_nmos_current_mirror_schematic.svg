<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510">
<rect width="1120" height="510" fill="#ffffff"/>
<text x="48" y="44" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#182433">Basic NMOS Current Mirror</text>
<text x="48" y="73" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5b6675">LTspice schematic preview · VDD = 1.8 V · IREF = 100 µA · W/L = 10 µm / 1 µm</text>
<g stroke="#315f91" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- VDD source -->
  <line x1="150" y1="145" x2="150" y2="170"/>
  <circle cx="150" cy="220" r="50"/>
  <line x1="150" y1="270" x2="150" y2="300"/>
  <!-- supply positive rail to current source -->
  <line x1="150" y1="145" x2="390" y2="145"/>
  <!-- IREF source -->
  <line x1="390" y1="145" x2="390" y2="170"/>
  <circle cx="390" cy="220" r="50"/>
  <line x1="390" y1="270" x2="390" y2="300"/>
  <!-- VREF rail -->
  <line x1="390" y1="300" x2="820" y2="300"/>
  <!-- M1 drain and gate to VREF -->
  <line x1="580" y1="300" x2="580" y2="345"/>
  <line x1="500" y1="300" x2="500" y2="390"/>
  <line x1="500" y1="390" x2="548" y2="390"/>
  <!-- M1 symbol -->
  <line x1="555" y1="350" x2="555" y2="430"/>
  <line x1="580" y1="350" x2="580" y2="430"/>
  <line x1="580" y1="430" x2="580" y2="465"/>
  <!-- M2 gate from VREF -->
  <line x1="820" y1="300" x2="820" y2="390"/>
  <line x1="820" y1="390" x2="855" y2="390"/>
  <!-- M2 symbol -->
  <line x1="862" y1="350" x2="862" y2="430"/>
  <line x1="890" y1="350" x2="890" y2="430"/>
  <line x1="890" y1="315" x2="890" y2="350"/>
  <line x1="890" y1="430" x2="890" y2="465"/>
  <!-- VOUT to sweep source -->
  <line x1="890" y1="315" x2="890" y2="220"/>
  <line x1="890" y1="220" x2="1030" y2="220"/>
  <line x1="1030" y1="220" x2="1030" y2="245"/>
  <circle cx="1030" cy="295" r="50"/>
  <line x1="1030" y1="345" x2="1030" y2="390"/>
  <!-- grounds -->
  <line x1="150" y1="300" x2="150" y2="325"/>
  <line x1="122" y1="325" x2="178" y2="325"/>
  <line x1="130" y1="338" x2="170" y2="338"/>
  <line x1="139" y1="351" x2="161" y2="351"/>
  <line x1="580" y1="465" x2="580" y2="480"/>
  <line x1="552" y1="480" x2="608" y2="480"/>
  <line x1="560" y1="493" x2="600" y2="493"/>
  <line x1="569" y1="506" x2="591" y2="506"/>
  <line x1="890" y1="465" x2="890" y2="480"/>
  <line x1="862" y1="480" x2="918" y2="480"/>
  <line x1="870" y1="493" x2="910" y2="493"/>
  <line x1="879" y1="506" x2="901" y2="506"/>
  <line x1="1030" y1="390" x2="1030" y2="405"/>
  <line x1="1002" y1="405" x2="1058" y2="405"/>
  <line x1="1010" y1="418" x2="1050" y2="418"/>
  <line x1="1019" y1="431" x2="1041" y2="431"/>
</g>
<!-- current arrow -->
<g stroke="#315f91" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <line x1="390" y1="190" x2="390" y2="245"/>
 <path d="M380 231 L390 247 L400 231"/>
</g>
<!-- voltage polarity -->
<g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#315f91" text-anchor="middle">
 <text x="150" y="211">+</text><text x="150" y="246">−</text>
 <text x="1030" y="287">+</text><text x="1030" y="322">−</text>
</g>
<!-- nodes -->
<g fill="#315f91">
 <circle cx="390" cy="300" r="6"/><circle cx="500" cy="300" r="6"/><circle cx="580" cy="300" r="6"/><circle cx="820" cy="300" r="6"/>
</g>
<!-- labels -->
<g font-family="Arial, Helvetica, sans-serif" fill="#182433">
 <text x="72" y="118" font-size="19" font-weight="700">VDD</text>
 <text x="72" y="142" font-size="16">V1 = 1.8 V</text>
 <text x="425" y="187" font-size="19" font-weight="700">IREF</text>
 <text x="425" y="211" font-size="16">100 µA</text>
 <text x="405" y="286" font-size="17" font-weight="700">VREF</text>
 <text x="570" y="338" font-size="18" font-weight="700">M1</text>
 <text x="570" y="365" font-size="15">NMOS</text>
 <text x="880" y="338" font-size="18" font-weight="700">M2</text>
 <text x="880" y="365" font-size="15">NMOS</text>
 <text x="940" y="195" font-size="18" font-weight="700">VOUT</text>
 <text x="1075" y="281" font-size="17" font-weight="700">VSWEEP</text>
 <text x="1075" y="306" font-size="15">0–1.8 V</text>
 <text x="48" y="468" font-size="14" fill="#5b6675">M1 is diode-connected: D1 = G1 = G2 = VREF. Both sources and bulks are grounded.</text>
</g>
</svg>